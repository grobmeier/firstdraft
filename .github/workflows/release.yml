name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Validate release tag and metadata
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be an exact semantic version without a v prefix."
            exit 1
          fi
          test "$(node -p "require('./manifest.json').version")" = "$VERSION"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          node -e 'const versions = require("./versions.json"); const manifest = require("./manifest.json"); if (versions[process.env.VERSION] !== manifest.minAppVersion) process.exit(1)'
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci
      - run: npm run license:headers:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Attest Obsidian release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            main.js \
            manifest.json \
            styles.css \
            --title "First Draft $VERSION" \
            --notes-file "docs/releases/$VERSION.md" \
            --verify-tag

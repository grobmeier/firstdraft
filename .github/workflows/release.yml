name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Validate release tag and metadata
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-beta\.[0-9]+)?$ ]]; then
            echo "Release tag must be a numeric version, optionally followed by -beta.N, without a v prefix."
            exit 1
          fi
          export MANIFEST_VERSION="${BASH_REMATCH[1]}"
          test "$(node -p "require('./manifest.json').version")" = "$MANIFEST_VERSION"
          test "$(node -p "require('./package.json').version")" = "$MANIFEST_VERSION"
          node -e 'const versions = require("./versions.json"); const manifest = require("./manifest.json"); if (versions[process.env.MANIFEST_VERSION] !== manifest.minAppVersion) process.exit(1)'
          git fetch origin main
          if [[ "$VERSION" == *-beta.* ]]; then
            # Beta metadata may live on a branch descended from main so that
            # community installation keeps the current stable manifest version.
            git merge-base --is-ancestor origin/main "$GITHUB_SHA"
          else
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
      - run: npm ci
      - run: npm run license:headers:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Attest Obsidian release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          release_flags=()
          if [[ "$VERSION" == *-beta.* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$VERSION" \
            main.js \
            manifest.json \
            styles.css \
            --title "First Draft $VERSION" \
            --notes-file "docs/releases/$VERSION.md" \
            --verify-tag \
            "${release_flags[@]}"
